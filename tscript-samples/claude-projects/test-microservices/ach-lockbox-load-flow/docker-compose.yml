      - ach-network

  accounting-service:
    build:
      context: .
      dockerfile: Dockerfile.shared-services
      target: accounting-service-runtime
    container_name: accounting-service
    ports:
      - "3031:3031"
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      KAFKA_BROKER: kafka:29092
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/appdb
      REDIS_URL: redis://redis:6379
      SERVICE_NAME: accounting-service
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_ISSUER: ach-lockbox-platform
    depends_on:
      shared-components:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - ach-network

volumes:
  postgres_data:

networks:
  ach-network:
    driver: bridge
